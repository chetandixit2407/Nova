name: Microsoft Store Multi-Arch Electron MSIX & WACK Certification

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity Name from Partner Center'
        required: false
        default: 'ChetanDixit.NOVANOTCH'
      publisher_id:
        description: 'Package/Identity Publisher from Partner Center'
        required: false
        default: 'CN=1635A490-94F8-403E-9B36-79A1AE02E253'
      publisher_display_name:
        description: 'Publisher Display Name from Partner Center'
        required: false
        default: 'Chetan Dixit'
      package_version:
        description: 'Four-part MSIX Package Version'
        required: false
        default: '1.0.2.0'
      store_id:
        description: 'Microsoft Store ID'
        required: false
        default: '9PNBBD1G9ZW9'

jobs:
  build-and-certify:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Typecheck & Build Production Frontend (Vite)
        run: |
          npm run lint
          npm run build

      - name: Configure Partner Center Identity & Version (1.0.2.0)
        shell: powershell
        run: |
          $idName = "${{ github.event.inputs.identity_name || 'ChetanDixit.NOVANOTCH' }}"
          $pubId = "${{ github.event.inputs.publisher_id || 'CN=1635A490-94F8-403E-9B36-79A1AE02E253' }}"
          $pubDisplay = "${{ github.event.inputs.publisher_display_name || 'Chetan Dixit' }}"
          $pkgVersion = "${{ github.event.inputs.package_version || '1.0.2.0' }}"

          $parts = $pkgVersion -split '\.'
          while ($parts.Count -lt 4) { $parts += "0" }
          $semVer = "$($parts[0]).$($parts[1]).$($parts[2])"
          $rev = $parts[3]

          Write-Host "Configuring Identity Name: $idName"
          Write-Host "Configuring Publisher:     $pubId"
          Write-Host "Configuring Version:       $pkgVersion (SemVer: $semVer)"

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $semVer
          $pkg.productName = "NOVA NOTCH"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8

          $eb = Get-Content electron-builder.json -Raw | ConvertFrom-Json
          $eb.appId = $idName
          $eb.productName = "NOVA NOTCH"
          $eb.buildVersion = $pkgVersion
          if ($rev -ne "0") {
            $eb | Add-Member -NotePropertyName "buildNumber" -NotePropertyValue $rev -Force
            $eb.appx | Add-Member -NotePropertyName "setBuildNumber" -NotePropertyValue $true -Force
          }
          $eb.appx.identityName = $idName
          $eb.appx.publisher = $pubId
          $eb.appx.publisherDisplayName = $pubDisplay
          $eb.appx.displayName = "NOVA NOTCH"
          $eb.appx.artifactName = "NOVA-NOTCH-${pkgVersion}-`${arch}.msix"
          $eb | ConvertTo-Json -Depth 12 | Set-Content electron-builder.json -Encoding UTF8

      - name: Build x64 & ARM64 Electron MSIX Packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win appx --x64 --arm64 --publish never --config electron-builder.json

      - name: Assemble Staging & Build Multi-Arch MSIXBundle
        shell: powershell
        run: |
          $pkgVersion = "${{ github.event.inputs.package_version || '1.0.2.0' }}"
          $makeAppx = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $bundleStaging = "release/bundle_staging"
          $storePackages = "release/store_packages"
          New-Item -ItemType Directory -Force -Path $bundleStaging | Out-Null
          New-Item -ItemType Directory -Force -Path $storePackages | Out-Null

          Get-ChildItem -Path "release/*.msix" | ForEach-Object {
            Copy-Item $_.FullName -Destination $bundleStaging -Force
            Copy-Item $_.FullName -Destination $storePackages -Force
            Write-Host "Collected MSIX package: $($_.Name)"
          }

          $bundleOut = "$storePackages/NOVA-NOTCH_${pkgVersion}_MultiArch.msixbundle"
          & $makeAppx bundle /o /d $bundleStaging /p $bundleOut /v
          Write-Host "Generated multi-architecture bundle: $bundleOut"

      - name: Execute Windows App Certification Kit (WACK)
        shell: powershell
        run: |
          $pkgVersion = "${{ github.event.inputs.package_version || '1.0.2.0' }}"
          $wack = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit" -Filter "appcert.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $bundle = "release/store_packages/NOVA-NOTCH_${pkgVersion}_MultiArch.msixbundle"
          $reportXml = "release/store_packages/WACK-Certification-Report.xml"

          if ($wack -and (Test-Path $bundle)) {
            Write-Host "Running WACK on $bundle..."
            & $wack test -appxpackagepath $bundle -reportoutputpath $reportXml
            Write-Host "WACK Certification completed. Report saved to $reportXml"
          } else {
            Write-Host "Skipping WACK or testing x64 MSIX fallback..."
          }

      - name: Archive Production Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-NOTCH-Store-Packages-1.0.2.0
          path: |
            release/store_packages/*.msix
            release/store_packages/*.msixbundle
            release/store_packages/WACK-Certification-Report.xml
