name: Microsoft Store Multi-Arch MSIX & WACK Certification

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity Name from Partner Center'
        required: false
        default: 'ChetanDixit.NOVANOTCH'
      publisher_id:
        description: 'Package/Identity Publisher from Partner Center'
        required: false
        default: 'CN=1635A490-94F8-403E-9B36-79A1AE02E253'
      publisher_display_name:
        description: 'Publisher Display Name from Partner Center'
        required: false
        default: 'Chetan Dixit'
      store_id:
        description: 'Microsoft Store ID'
        required: false
        default: '9PNBBD1G9ZW9'

jobs:
  build-and-certify:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable with x64 and ARM64 Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Frontend (Vite)
        run: npm run build

      - name: Setup Tauri CLI
        run: cargo install tauri-cli --version ^2.0.0

      - name: Apply Partner Center Identity (if provided)
        shell: powershell
        run: |
          $idName = "${{ github.event.inputs.identity_name || 'ChetanDixit.NOVANOTCH' }}"
          $pubId = "${{ github.event.inputs.publisher_id || 'CN=1635A490-94F8-403E-9B36-79A1AE02E253' }}"
          $pubDisplay = "${{ github.event.inputs.publisher_display_name || 'Chetan Dixit' }}"
          
          Write-Host "Configuring Identity Name: $idName"
          Write-Host "Configuring Publisher: $pubId"
          
          # Update AppxManifest.xml
          (Get-Content src-tauri/AppxManifest.xml) `
            -replace 'Name="[^"]+"', "Name=`"$idName`"" `
            -replace 'Publisher="[^"]+"', "Publisher=`"$pubId`"" `
            -replace '<PublisherDisplayName>[^<]*</PublisherDisplayName>', "<PublisherDisplayName>$pubDisplay</PublisherDisplayName>" |
            Set-Content src-tauri/AppxManifest.xml
            
          # Update tauri.conf.json
          (Get-Content src-tauri/tauri.conf.json) `
            -replace '"name":\s*"[^"]+"', "`"name`": `"$idName`"" `
            -replace '"publisher":\s*"[^"]+"', "`"publisher`": `"$pubId`"" |
            Set-Content src-tauri/tauri.conf.json

      - name: Build x64 MSIX Package
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msix

      - name: Build ARM64 MSIX Package
        run: cargo tauri build --target aarch64-pc-windows-msvc --bundles msix

      - name: Assemble Staging & Build MSIXBundle
        shell: powershell
        run: |
          $makeAppx = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Select-Object -First 1).FullName
          $bundleStaging = "target/store_bundle_staging"
          New-Item -ItemType Directory -Force -Path $bundleStaging | Out-Null
          New-Item -ItemType Directory -Force -Path "target/store_packages" | Out-Null
          
          # Copy x64 and arm64 msix into staging
          Get-ChildItem -Path "src-tauri/target/*/release/bundle/msix/*.msix" | ForEach-Object {
            Copy-Item $_.FullName -Destination $bundleStaging
            Copy-Item $_.FullName -Destination "target/store_packages"
            Write-Host "Collected package: $($_.Name)"
          }
          
          # Build MSIXBundle
          & $makeAppx bundle /d $bundleStaging /p "target/store_packages/NOVA_1.0.0.0_MultiArch.msixbundle" /v
          Write-Host "Generated multi-architecture bundle: target/store_packages/NOVA_1.0.0.0_MultiArch.msixbundle"

      - name: Execute Windows App Certification Kit (WACK)
        shell: powershell
        run: |
          $wack = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit" -Filter "appcert.exe" -Recurse | Select-Object -First 1).FullName
          $bundle = "target/store_packages/NOVA_1.0.0.0_MultiArch.msixbundle"
          $reportXml = "target/WACK-Certification-Report.xml"
          
          if (Test-Path $bundle) {
            Write-Host "Running WACK on MSIXBundle..."
            & $wack test -appxpackagepath $bundle -reportoutputpath $reportXml
            Write-Host "WACK Live Certification completed. Report generated at $reportXml"
          } else {
            $x64 = Get-ChildItem -Path "target/store_packages/*x64*.msix" | Select-Object -First 1
            if ($x64) {
              Write-Host "Running WACK on x64 MSIX..."
              & $wack test -appxpackagepath $x64.FullName -reportoutputpath $reportXml
            }
          }

      - name: Archive Production Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Store-Packages
          path: |
            target/store_packages/*.msix
            target/store_packages/*.msixbundle
            target/WACK-Certification-Report.xml
